# Integração contínua: backend (build, testes, ArchUnit, Checkstyle, Spotless, JaCoCo, IT com
# Testcontainers), frontend (formatação, traduções, cliente gerado, testes, build) e E2E com as
# imagens Docker (os 10 cenários de docs/06 pela interface).
name: CI

on:
  push:
    branches: [main, implementacao-inicial]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  backend:
    name: Backend (mvn verify)
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: maven

      - name: Build e testes (inclui IT com PostgreSQL em Testcontainers)
        run: mvn -B -ntp verify

      - name: O OpenAPI do frontend está atualizado
        run: |
          node -e '
            const a = JSON.stringify(require("./backend/pericial-api/target/openapi.json"));
            const b = JSON.stringify(require("./frontend/openapi/openapi.json"));
            if (a !== b) {
              console.error("frontend/openapi/openapi.json desatualizado: correr `npm run api:atualizar` em frontend/");
              process.exit(1);
            }'

      - name: Relatórios de testes
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: relatorios-backend
          path: |
            backend/*/target/surefire-reports/
            backend/*/target/failsafe-reports/
          retention-days: 7

  frontend:
    name: Frontend (testes e build)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci

      - name: Formatação
        run: npm run verificar

      - name: O cliente gerado corresponde ao OpenAPI
        run: |
          npm run api:gerar
          git diff --exit-code -- src/app/api

      - name: As traduções cobrem as mensagens atuais do código
        run: |
          npm run i18n:extrair
          npm run i18n:verificar

      - name: Testes unitários
        run: npm test

      - name: Build de produção (pt-PT e en)
        run: npm run build

  e2e:
    name: E2E (Playwright sobre docker compose)
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - name: Imagens e arranque (PostgreSQL, API, frontend)
        run: docker compose up --build --detach --wait --wait-timeout 300

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Dependências e browser
        working-directory: frontend
        run: |
          npm ci
          npx playwright install --with-deps chromium

      - name: Cenários e explicações pela interface
        working-directory: frontend
        env:
          E2E_URL: http://localhost:8081/pt-PT/
        run: npx playwright test

      - name: Logs da API
        if: failure()
        run: docker compose logs api

      - name: Relatório do Playwright
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: relatorio-e2e
          path: |
            frontend/playwright-report/
            frontend/test-results/
          retention-days: 7

      - name: Parar
        if: always()
        run: docker compose down --volumes
