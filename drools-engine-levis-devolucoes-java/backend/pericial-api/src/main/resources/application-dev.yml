# Desenvolvimento local: PostgreSQL do docker-compose e tokens assinados localmente.
spring:
  datasource:
    url: ${PERICIAL_DB_URL:jdbc:postgresql://localhost:5432/pericial}
    username: ${PERICIAL_DB_UTILIZADOR:pericial}
    password: ${PERICIAL_DB_PALAVRA_PASSE:pericial}

pericial:
  seguranca:
    # Chave só para desenvolvimento local; em produção não há chave (tokens do fornecedor OIDC).
    chave-hmac: ${PERICIAL_JWT_CHAVE:chave-local-de-desenvolvimento-nao-usar-em-producao}
    origens-cors: ${PERICIAL_CORS_ORIGENS:http://localhost:4200,http://localhost:3000}
