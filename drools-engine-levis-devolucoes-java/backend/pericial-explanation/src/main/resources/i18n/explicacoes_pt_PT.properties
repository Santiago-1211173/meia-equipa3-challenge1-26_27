# Textos das explicações (pt-PT). As aspas simples duplicam-se ('') no MessageFormat.
porquenao.disparou=A regra {0} disparou.
porquenao.modulo_nao_alcancado=A regra {0} não chegou a ser avaliada: a paragem obrigatória {1} terminou o fluxo no módulo {2}.
porquenao.cancelada=A regra {0} foi ativada, mas foi cancelada depois de {1} ter disparado com precedência: {2}
porquenao.condicoes=A regra {0} não disparou porque estas condições não se verificam: {1}.
porquenao.condicoes_cumpridas=A regra {0} não disparou, embora as condições declaradas se verifiquem no estado final; foi impedida pela ordem de avaliação ou já não se aplicava quando o seu módulo foi avaliado.
como.resumo=Foram aplicadas {0} regras em {1} módulos.
como.paragem=A paragem obrigatória {0} terminou o fluxo no módulo {1}.
emfalta.resumo=Faltam {0} dado(s) obrigatório(s) e {1} dado(s) para decidir uma revisão.
emfalta.completo=Os dados obrigatórios estão completos.
esenao.resumo=A alteração muda {0} campo(s) do resultado.
esenao.sem_diferencas=A alteração não muda o resultado.
como.conclusao={0} = {1}: concluído por {2} — {3}
como.conclusao_sem_regra={0} = {1}: nenhuma regra chegou a esta conclusão.
porquenao.conclusao_obtida=A conclusão {0} foi obtida (por {1}).
porquenao.conclusao_substituida=A conclusão {0} chegou a ser proposta por {1}, mas o resultado final é {2}, definido por {3} (prevalece o resultado mais severo ou posterior).
porquenao.conclusao_nao_produzida=A conclusão {0} não foi obtida (resultado: {1}). Nenhuma das regras que a podem produzir o fez: {2}
porquenao.conclusao_sem_regras=Nenhuma regra da base de conhecimento produz a conclusão {0}.
porque.pergunta=Pergunto "{0}" porque {1} decisão(ões) deste pedido dependem da resposta: {2}.
porque.sem_espera={0} No pedido atual, nenhuma decisão terminal está imediatamente dependente desta resposta porque os restantes requisitos ainda não foram avaliados.
